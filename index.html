<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JIRO Travel</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
      background: #f8f8f6;
      color: #222;
    }

    header {
      background: white;
      border-bottom: 1px solid #eee;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-weight: 400;
    }

    .language {
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: white;
      font-size: 14px;
    }

    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 24px 40px;
    }

    .hero h1 {
      margin: 0 0 14px;
      font-size: 42px;
      line-height: 1.25;
      letter-spacing: -1.5px;
    }

    .hero p {
      margin: 0;
      color: #777;
      font-size: 17px;
      line-height: 1.7;
    }

    .search-box {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }

    .controls {
      background: white;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .controls select,
    .controls button {
      height: 46px;
      padding: 0 16px;
      border-radius: 7px;
      font-size: 15px;
    }

    .controls select {
      min-width: 180px;
      border: 1px solid #ddd;
      background: white;
    }

    .controls button {
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
      padding: 0 22px;
    }

    .controls button:hover {
      opacity: 0.85;
    }

    .content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
    }

    #status {
      margin-bottom: 20px;
      color: #777;
      font-size: 14px;
    }

    .places {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    .card-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 18px;
    }

    .card h2 {
      margin: 0 0 9px;
      font-size: 18px;
      line-height: 1.4;
    }

    .card p {
      margin: 0;
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    .detail {
      display: none;
      margin-top: 40px;
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .detail-main-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      margin-bottom: 25px;
    }

    .detail h2 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.4;
    }

    .detail-address {
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .detail-overview {
      line-height: 1.8;
      color: #444;
      font-size: 15px;
      white-space: pre-line;
    }

    .gallery-title {
      margin-top: 35px;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }

    .gallery img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .close-button {
      margin-top: 30px;
      height: 42px;
      padding: 0 18px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    footer {
      border-top: 1px solid #eee;
      background: white;
      padding: 30px 24px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 600px) {

      .header-inner {
        padding: 18px;
      }

      .hero {
        padding: 40px 18px 30px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .search-box,
      .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .controls {
        flex-direction: column;
      }

      .controls select,
      .controls button {
        width: 100%;
      }

      .detail {
        padding: 20px;
      }

    }

  </style>
</head>

<body>

  <header>

    <div class="header-inner">

      <div class="logo">
        JIRO <span>Travel</span>
      </div>

      <select
        id="language"
        class="language"
        onchange="changeLanguage()"
      >
        <option value="kr">한국어</option>
        <option value="en">English</option>
        <option value="jp">日本語</option>
      </select>

    </div>

  </header>


  <section class="hero">

    <h1 id="heroTitle">
      한국의 지역을<br>
      여행하다
    </h1>

    <p id="description">
      한국의 지역 관광정보를 소개합니다.
    </p>

  </section>


  <section class="search-box">

    <div class="controls">

      <select id="areaCode">

        <option value="1">서울특별시</option>
        <option value="2">인천광역시</option>
        <option value="3">대전광역시</option>
        <option value="4">대구광역시</option>
        <option value="5">광주광역시</option>
        <option value="6">부산광역시</option>
        <option value="7">울산광역시</option>
        <option value="8">세종특별자치시</option>
        <option value="31">경기도</option>
        <option value="32">강원특별자치도</option>
        <option value="33">충청북도</option>
        <option value="34">충청남도</option>
        <option value="35">경상북도</option>
        <option value="36">경상남도</option>
        <option value="37">전북특별자치도</option>
        <option value="38">전라남도</option>
        <option value="39">제주특별자치도</option>

      </select>


      <button
        onclick="loadPlaces()"
        id="loadButton"
      >
        관광정보 불러오기
      </button>

    </div>

  </section>


  <main class="content">

    <div id="status"></div>

    <div
      id="places"
      class="places"
    ></div>

    <div
      id="detail"
      class="detail"
    ></div>

  </main>


  <footer>
    JIRO Travel · Local Now
  </footer>


  <script>

    const languageText = {

      kr: {
        heroTitle: "한국의 지역을<br>여행하다",
        description:
          "한국의 지역 관광정보를 소개합니다.",
        button:
          "관광정보 불러오기",
        loading:
          "관광정보를 불러오는 중입니다...",
        result: (total, count) =>
          `총 ${total}개의 관광정보 중 ${count}개를 표시합니다.`,
        error:
          "관광정보를 불러오지 못했습니다.",
        empty:
          "관광정보가 없습니다.",
        detailLoading:
          "상세정보를 불러오는 중입니다...",
        galleryTitle:
          "사진",
        noImages:
          "추가 사진이 없습니다.",
        close:
          "닫기"
      },

      en: {
        heroTitle:
          "Travel through<br>Korea's regions",
        description:
          "Discover local tourism information across Korea.",
        button:
          "Load Tourism Information",
        loading:
          "Loading tourism information...",
        result: (total, count) =>
          `Showing ${count} of ${total} tourism information items.`,
        error:
          "Failed to load tourism information.",
        empty:
          "No tourism information found.",
        detailLoading:
          "Loading details...",
        galleryTitle:
          "Photos",
        noImages:
          "No additional photos available.",
        close:
          "Close"
      },

      jp: {
        heroTitle:
          "韓国の地域を<br>旅する",
        description:
          "韓国各地域の観光情報をご紹介します。",
        button:
          "観光情報を読み込む",
        loading:
          "観光情報を読み込んでいます...",
        result: (total, count) =>
          `全${total}件の観光情報のうち${count}件を表示しています。`,
        error:
          "観光情報を読み込めませんでした。",
        empty:
          "観光情報がありません。",
        detailLoading:
          "詳細情報を読み込んでいます...",
        galleryTitle:
          "写真",
        noImages:
          "追加の写真はありません。",
        close:
          "閉じる"
      }

    };


    function changeLanguage() {

      const language =
        document.getElementById("language").value;

      const text =
        languageText[language];


      document.getElementById("heroTitle").innerHTML =
        text.heroTitle;

      document.getElementById("description").textContent =
        text.description;

      document.getElementById("loadButton").textContent =
        text.button;


      document.getElementById("places").innerHTML =
        "";

      document.getElementById("detail").style.display =
        "none";

      document.getElementById("status").textContent =
        "";

    }


    async function loadPlaces() {

      const language =
        document.getElementById("language").value;

      const areaCode =
        document.getElementById("areaCode").value;

      const text =
        languageText[language];

      const status =
        document.getElementById("status");

      const places =
        document.getElementById("places");

      const detail =
        document.getElementById("detail");


      status.textContent =
        text.loading;

      places.innerHTML =
        "";

      detail.style.display =
        "none";


      try {

        const response =
          await fetch(
            `https://api.travel.localnow.kr/${language}/areaBasedList2?areaCode=${areaCode}&numOfRows=20`
          );


        const data =
          await response.json();


        const items =
          data.response.body.items.item || [];


        if (items.length === 0) {

          status.textContent =
            text.empty;

          return;

        }


        status.textContent =
          text.result(
            data.response.body.totalCount,
            items.length
          );


        items.forEach(item => {

          const card =
            document.createElement("div");

          card.className =
            "card";


          const image =
            item.firstimage ||
            "https://via.placeholder.com/600x400?text=JIRO+Travel";


          card.innerHTML = `

            <img
              class="card-image"
              src="${image}"
              alt="${item.title || ""}"
            >

            <div class="card-content">

              <h2>
                ${item.title || "JIRO Travel"}
              </h2>

              <p>
                ${item.addr1 || ""}
              </p>

            </div>

          `;


          card.addEventListener(
            "click",
            () => {
              loadDetail(item.contentid);
            }
          );


          places.appendChild(card);

        });


      } catch (error) {

        console.error(error);

        status.textContent =
          text.error;

      }

    }


    async function loadDetail(contentId) {

      const language =
        document.getElementById("language").value;

      const text =
        languageText[language];

      const detail =
        document.getElementById("detail");


      detail.style.display =
        "block";


      detail.innerHTML =
        `<p>${text.detailLoading}</p>`;


      detail.scrollIntoView({
        behavior: "smooth"
      });


      try {

        const detailResponse =
          await fetch(
            `https://api.travel.localnow.kr/${language}/detailCommon2?contentId=${contentId}`
          );


        const detailData =
          await detailResponse.json();


        const item =
          detailData.response.body.items.item[0];


        if (!item) {

          detail.innerHTML =
            `<p>${text.error}</p>`;

          return;

        }


        const mainImage =
          item.firstimage ||
          "https://via.placeholder.com/800x500?text=JIRO+Travel";


        let images = [];


        try {

          const imageResponse =
            await fetch(
              `https://api.travel.localnow.kr/${language}/detailImage2?contentId=${contentId}`
            );


          const imageData =
            await imageResponse.json();


          images =
            imageData.response.body.items.item || [];

        } catch (imageError) {

          console.error(imageError);

        }


        let galleryHTML = "";


        if (images.length > 0) {

          galleryHTML = `

            <h3 class="gallery-title">
              ${text.galleryTitle}
            </h3>

            <div class="gallery">

              ${images.map(image => `

                <img
                  src="${image.originimgurl}"
                  alt="${item.title || ""}"
                >

              `).join("")}

            </div>

          `;

        } else {

          galleryHTML =
            `<p>${text.noImages}</p>`;

        }


        detail.innerHTML = `

          <img
            class="detail-main-image"
            src="${mainImage}"
            alt="${item.title || ""}"
          >

          <h2>
            ${item.title || ""}
          </h2>

          <div class="detail-address">
            ${item.addr1 || ""}
          </div>

          <div class="detail-overview">
            ${item.overview || ""}
          </div>

          ${galleryHTML}

          <button
            class="close-button"
            onclick="closeDetail()"
          >
            ${text.close}
          </button>

        `;


      } catch (error) {

        console.error(error);

        detail.innerHTML =
          `<p>${text.error}</p>`;

      }

    }


    function closeDetail() {

      document.getElementById("detail").style.display =
        "none";

    }

  </script>

</body>
</html>
