<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JIRO Travel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      margin-bottom: 30px;
    }

    button {
      padding: 10px 18px;
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      opacity: 0.8;
    }

    #status {
      margin: 20px 0;
      color: #666;
    }

    .places {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 16px;
    }

    .card h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    .card p {
      font-size: 14px;
      color: #666;
      margin: 5px 0;
    }
  </style>
</head>

<body>

  <h1>JIRO Travel</h1>

  <div class="description">
    한국의 지역 관광정보를 소개합니다.
  </div>

  <button onclick="loadPlaces()">서울 관광정보 불러오기</button>

  <div id="status"></div>

  <div id="places" class="places"></div>

  <script>
    async function loadPlaces() {

      const status = document.getElementById("status");
      const places = document.getElementById("places");

      status.textContent = "관광정보를 불러오는 중입니다...";
      places.innerHTML = "";

      try {

        const response = await fetch(
          "https://api.travel.localnow.kr/kr/areaBasedList2?areaCode=1&numOfRows=20"
        );

        const data = await response.json();

        const items =
          data.response.body.items.item || [];

        status.textContent =
          `총 ${data.response.body.totalCount}개의 관광정보 중 ${items.length}개를 표시합니다.`;

        items.forEach(item => {

          const card = document.createElement("div");
          card.className = "card";

          const image =
            item.firstimage ||
            "https://via.placeholder.com/600x400?text=JIRO+Travel";

          card.innerHTML = `
            <img src="${image}" alt="${item.title}">
            <div class="card-content">
              <h2>${item.title}</h2>
              <p>${item.addr1 || ""}</p>
            </div>
          `;

          places.appendChild(card);

        });

      } catch (error) {

        console.error(error);

        status.textContent =
          "관광정보를 불러오지 못했습니다.";

      }

    }
  </script>

</body>
</html>
